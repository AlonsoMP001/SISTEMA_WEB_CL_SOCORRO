<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Médico - Clínica María del Socorro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #0284c7; --primary-dark: #0369a1; --primary-light: #e0f2fe; --text-main: #0f172a; --text-body: #475569; --bg-light: #f8fafc; --font-display: 'Outfit', sans-serif; --font-base: 'Poppins', sans-serif; }
        body { font-family: var(--font-base); background-color: var(--bg-light); color: var(--text-main); }
        .navbar { background-color: white; border-bottom: 1px solid #e2e8f0; }
        .nav-link { color: var(--text-body); font-weight: 500; }
        .nav-link.active { color: var(--primary); background-color: var(--primary-light); border-radius: 8px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); }
        .profile-header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 40px 20px; border-radius: 16px 16px 0 0; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; background-color: white; color: var(--primary); font-size: 3rem; font-family: var(--font-display); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 4px solid #bae6fd; margin-bottom: 15px; }
        .info-label { font-size: 0.85rem; color: var(--text-body); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .info-value { font-size: 1.1rem; font-weight: 500; color: var(--text-main); margin-bottom: 20px; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color:var(--primary)" href="#">Panel Médico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/medico/perfil}">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/citas}">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/horarios}">Mis Horarios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/historial}">Historial Médico</a></li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-avatar" th:text="${medico.persona.nombres.substring(0,1)} + ${medico.persona.apellidos.substring(0,1)}">MD</div>
                        <h2 th:text="${medico.persona.nombres} + ' ' + ${medico.persona.apellidos}">Nombre Apellido</h2>
                        <p class="mb-0 fs-5"><i class="bi bi-heart-pulse me-2"></i><span th:text="${medico.especialidad.nombreEspecialidad}">Especialidad</span></p>
                    </div>
                    <div class="card-body p-5">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="info-label">DNI</div>
                                <div class="info-value" th:text="${medico.persona.dni}">12345678</div>
                                
                                <div class="info-label">CMP</div>
                                <div class="info-value" th:text="${medico.cmp}">CMP000</div>
                                
                                <div class="info-label">Género</div>
                                <div class="info-value" th:text="${medico.persona.genero}">Masculino</div>
                            </div>
                            <div class="col-md-6">
                                <div class="info-label">Correo Electrónico</div>
                                <div class="info-value" th:text="${medico.persona.correo}">correo@ejemplo.com</div>
                                
                                <div class="info-label">Teléfono</div>
                                <div class="info-value" th:text="${medico.persona.telefono}">999888777</div>
                                
                                <div class="info-label">Fecha de Nacimiento</div>
                                <div class="info-value" th:text="${medico.persona.fechaNacimiento}">1980-01-01</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
