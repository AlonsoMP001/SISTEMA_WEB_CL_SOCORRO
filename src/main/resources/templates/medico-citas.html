<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - Clínica María del Socorro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js'></script>
    <style>
        :root { --primary: #0284c7; --primary-light: #e0f2fe; --text-main: #0f172a; --bg-light: #f8fafc; --font-base: 'Poppins', sans-serif; --calendar-teal: #30babb; }
        body { font-family: var(--font-base); background-color: var(--bg-light); color: var(--text-main); }
        .navbar { background-color: white; border-bottom: 1px solid #e2e8f0; }
        .nav-link { color: #475569; font-weight: 500; }
        .nav-link.active { color: var(--primary); background-color: var(--primary-light); border-radius: 8px; }
        
        /* Calendar Styling */
        #calendar-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        
        .fc .fc-toolbar.fc-header-toolbar {
            background-color: var(--calendar-teal);
            color: white;
            margin-bottom: 0;
            padding: 20px 24px;
            border-radius: 12px 12px 0 0;
        }
        
        .fc .fc-toolbar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
        }
        
        .fc .fc-button-primary {
            background-color: transparent !important;
            border-color: white !important;
            color: white !important;
            box-shadow: none !important;
        }
        
        .fc .fc-button-primary:not(:disabled):active, 
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:hover {
            background-color: rgba(255, 255, 255, 0.2) !important;
            border-color: white !important;
        }
        
        .fc-theme-standard th {
            border: none;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 500;
            font-size: 0.8rem;
            text-align: left;
            padding-left: 10px;
        }
        
        .fc-theme-standard td, .fc-theme-standard th {
            border-color: #f1f5f9;
        }
        
        .fc-daygrid-day-top {
            justify-content: flex-end;
            padding: 8px 10px 0 0;
        }
        
        .fc-daygrid-day-number {
            font-size: 1.1rem;
            color: #0f172a;
        }
        
        /* Highlight Today */
        .fc-day-today {
            background-color: transparent !important;
        }
        .fc-day-today .fc-daygrid-day-frame {
            background-color: var(--calendar-teal) !important;
            color: white;
        }
        .fc-day-today .fc-daygrid-day-number {
            color: white;
        }
        
        /* Event Styling */
        .fc-event {
            background-color: transparent;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
        }
        .fc-day-today .fc-event {
            /* If event is on today, make text lighter to contrast teal bg */
            color: rgba(255, 255, 255, 0.9);
        }
        
        .cita-event {
            display: flex;
            flex-direction: column;
            background: transparent;
            padding: 2px 0;
        }
        .cita-time {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }
        .fc-day-today .cita-time {
            color: rgba(255,255,255,0.8);
        }
        .cita-patient {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.85rem;
            line-height: 1.2;
        }
        .fc-day-today .cita-patient {
            color: white;
        }
        .cita-type {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }
        .fc-day-today .cita-type {
            color: rgba(255,255,255,0.9);
        }
        
        /* Create button style */
        .fc-customCreate-button {
            background-color: #f97316 !important; /* Orange button like image */
            border-color: #f97316 !important;
            color: white !important;
            border-radius: 6px;
            font-weight: 500;
            padding: 8px 16px !important;
        }
        .fc-customCreate-button:hover {
            background-color: #ea580c !important;
            border-color: #ea580c !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color:var(--primary)" href="#">Panel Médico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/perfil}">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/medico/citas}">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/horarios}">Mis Horarios</a></li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div id='calendar-container'>
            <div id='calendar'></div>
        </div>
    </div>

    <!-- Modal para Detalles de Cita -->
    <div class="modal fade" id="citaModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" style="font-family: 'Outfit', sans-serif;">Detalles de la Cita</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
                <small class="text-muted d-block">Paciente</small>
                <span id="modalPaciente" class="fw-bold fs-5"></span>
            </div>
            <div class="row mb-3">
                <div class="col-6">
                    <small class="text-muted d-block">DNI</small>
                    <span id="modalDni" class="fw-medium"></span>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">Estado</small>
                    <span id="modalEstado" class="badge rounded-pill bg-primary"></span>
                </div>
            </div>
            <div class="row">
                <div class="col-6">
                    <small class="text-muted d-block">Consultorio</small>
                    <span id="modalConsultorio" class="fw-medium"></span>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">Sede</small>
                    <span id="modalSede" class="fw-medium"></span>
                </div>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary px-4" id="btnAbrirAtencion">Atender Cita</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para Formulario de Atención Médica -->
    <div class="modal fade" id="atencionModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" style="color: var(--primary); font-family: 'Outfit', sans-serif;">
                Atención Médica <i class="bi bi-heart-pulse ms-2"></i>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="formAtencion">
                <input type="hidden" id="atencionIdCita" name="idCita">
                
                <h6 class="text-muted fw-bold mb-3 border-bottom pb-2">Triaje y Signos Vitales</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label small">Presión (ej. 120/80)</label>
                        <input type="text" class="form-control" name="triajePresion" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Temp. (°C)</label>
                        <input type="number" step="0.1" class="form-control" name="triajeTemperatura" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Peso (kg)</label>
                        <input type="number" step="0.1" class="form-control" name="triajePeso" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Saturación (%)</label>
                        <input type="number" class="form-control" name="triajeSaturacion" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Frec. Cardíaca</label>
                        <input type="number" class="form-control" name="triajeFrecuenciaCardiaca" required>
                    </div>
                </div>

                <h6 class="text-muted fw-bold mb-3 border-bottom pb-2">Consulta y Diagnóstico</h6>
                <div class="mb-3">
                    <label class="form-label fw-medium">Motivo de la Consulta</label>
                    <textarea class="form-control" name="motivoConsulta" rows="2" required></textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-medium">Cód. CIE-10</label>
                        <input type="text" class="form-control" name="codigoCie10" placeholder="Ej: J00" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-medium">Descripción del Diagnóstico</label>
                        <input type="text" class="form-control" name="descripcionDiagnostico" required>
                    </div>
                </div>
            </form>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success px-4" id="btnGuardarAtencion">
                Guardar y Finalizar <i class="bi bi-check-circle ms-1"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Div oculto para pasar datos desde Thymeleaf a JS de forma segura -->
    <div id="citas-data" style="display: none;">
        <div th:if="${citas != null}" th:each="cita : ${citas}" class="cita-item"
             th:data-id="${cita.idCita}"
             th:data-title="|${cita.paciente.nombres} ${cita.paciente.apellidos}|"
             th:data-start="|${cita.fechaCita}T${cita.horaCita}|"
             th:data-dni="${cita.paciente.dni}"
             th:data-consultorio="${cita.consultorio.numeroConsultorio}"
             th:data-sede="${cita.consultorio.sede.nombreSede}"
             th:data-estado="${cita.estadoCita}">
        </div>
    </div>

    <!-- Configuración del Calendario -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            var eventos = [];
            var citaActualId = null;
            
            // Leer los datos del DOM en lugar de inyectar JSON directamente
            var citaElements = document.querySelectorAll('.cita-item');
            citaElements.forEach(function(el) {
                eventos.push({
                    id: el.dataset.id,
                    title: el.dataset.title,
                    start: el.dataset.start,
                    extendedProps: {
                        dni: el.dataset.dni,
                        consultorio: el.dataset.consultorio,
                        sede: el.dataset.sede,
                        estado: el.dataset.estado
                    }
                });
            });

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 800,
                headerToolbar: {
                    left: 'title prev,next',
                    center: '',
                    right: '' // Ocultamos customCreate para medicos
                },
                events: eventos,
                eventContent: function(arg) {
                    var date = arg.event.start;
                    var timeString = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    var estadoClass = arg.event.extendedProps.estado === 'ATENDIDA' ? 'text-success' : '';
                    var icon = arg.event.extendedProps.estado === 'ATENDIDA' ? '<i class="bi bi-check-circle-fill"></i>' : '';
                    
                    var html = `
                        <div class="cita-event ${estadoClass}">
                            <div class="cita-time">${timeString} ${icon}</div>
                            <div class="cita-patient">${arg.event.title}</div>
                            <div class="cita-type">${arg.event.extendedProps.consultorio} - ${arg.event.extendedProps.estado}</div>
                        </div>
                    `;
                    return { html: html };
                },
                eventClick: function(info) {
                    citaActualId = info.event.id;
                    document.getElementById('modalPaciente').textContent = info.event.title;
                    document.getElementById('modalDni').textContent = info.event.extendedProps.dni;
                    document.getElementById('modalEstado').textContent = info.event.extendedProps.estado;
                    document.getElementById('modalConsultorio').textContent = info.event.extendedProps.consultorio;
                    document.getElementById('modalSede').textContent = info.event.extendedProps.sede;
                    
                    var btnAtender = document.getElementById('btnAbrirAtencion');
                    if(info.event.extendedProps.estado === 'PROGRAMADA') {
                        btnAtender.style.display = 'block';
                    } else {
                        btnAtender.style.display = 'none';
                    }
                    
                    var modal = new bootstrap.Modal(document.getElementById('citaModal'));
                    modal.show();
                }
            });
            
            calendar.render();

            // Abrir modal de atencion
            document.getElementById('btnAbrirAtencion').addEventListener('click', function() {
                var citaModal = bootstrap.Modal.getInstance(document.getElementById('citaModal'));
                citaModal.hide();
                document.getElementById('atencionIdCita').value = citaActualId;
                
                var atencionModal = new bootstrap.Modal(document.getElementById('atencionModal'));
                atencionModal.show();
            });

            // Guardar Atencion
            document.getElementById('btnGuardarAtencion').addEventListener('click', function() {
                var form = document.getElementById('formAtencion');
                if(!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                var formData = new FormData(form);
                var btn = this;
                btn.disabled = true;
                btn.innerHTML = 'Guardando... <span class="spinner-border spinner-border-sm"></span>';

                fetch('/medico/citas/atender', {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                })
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        alert("Atención médica registrada correctamente");
                        window.location.reload();
                    } else {
                        alert("Error: " + data.message);
                        btn.disabled = false;
                        btn.innerHTML = 'Guardar y Finalizar <i class="bi bi-check-circle ms-1"></i>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("Ocurrió un error al intentar guardar la atención.");
                    btn.disabled = false;
                    btn.innerHTML = 'Guardar y Finalizar <i class="bi bi-check-circle ms-1"></i>';
                });
            });
        });
    </script>
</body>
</html>
