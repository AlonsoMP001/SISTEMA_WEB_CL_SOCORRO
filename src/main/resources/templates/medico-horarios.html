<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Horarios - Clínica María del Socorro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #0284c7; --primary-light: #e0f2fe; --text-main: #0f172a; --bg-light: #f8fafc; --font-base: 'Poppins', sans-serif; }
        body { font-family: var(--font-base); background-color: var(--bg-light); color: var(--text-main); }
        .navbar { background-color: white; border-bottom: 1px solid #e2e8f0; }
        .nav-link { color: #475569; font-weight: 500; }
        .nav-link.active { color: var(--primary); background-color: var(--primary-light); border-radius: 8px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); }
        .table th { background-color: #f1f5f9; color: #475569; font-weight: 600; border-bottom: none; }
        .table td { vertical-align: middle; }
        .day-badge { background-color: var(--primary-light); color: var(--primary-dark); padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color:var(--primary)" href="#">Panel Médico</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/perfil}">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/medico/citas}">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/medico/horarios}">Mis Horarios</a></li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold" style="font-family: 'Outfit', sans-serif;">Horarios Asignados</h2>
        
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Día de la Semana</th>
                                <th>Horario</th>
                                <th>Sede</th>
                                <th>Dirección</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${horarios == null or horarios.isEmpty()}">
                                <td colspan="4" class="text-center py-4 text-muted">No tienes horarios asignados.</td>
                            </tr>
                            <tr th:each="horario : ${horarios}">
                                <td>
                                    <span class="day-badge" 
                                          th:text="${horario.diaSemana == 1 ? 'Lunes' : (horario.diaSemana == 2 ? 'Martes' : (horario.diaSemana == 3 ? 'Miércoles' : (horario.diaSemana == 4 ? 'Jueves' : (horario.diaSemana == 5 ? 'Viernes' : (horario.diaSemana == 6 ? 'Sábado' : 'Domingo')))))}">
                                        Lunes
                                    </span>
                                </td>
                                <td>
                                    <div class="fw-bold"><i class="bi bi-clock me-1"></i> <span th:text="${horario.horaInicio}">08:00</span> - <span th:text="${horario.horaFin}">13:00</span></div>
                                </td>
                                <td>
                                    <div class="fw-bold text-primary" th:text="${horario.sede.nombreSede}">Sede Principal</div>
                                </td>
                                <td>
                                    <div class="text-muted small" th:text="${horario.sede.direccion}">Dirección</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
