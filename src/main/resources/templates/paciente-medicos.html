<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos Disponibles - Clínica María del Socorro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #059669; --primary-dark: #047857; --primary-light: #d1fae5; --text-main: #0f172a; --text-body: #475569; --bg-light: #f8fafc; --font-display: 'Outfit', sans-serif; --font-base: 'Poppins', sans-serif; }
        body { font-family: var(--font-base); background-color: var(--bg-light); color: var(--text-main); }
        .navbar { background-color: white; border-bottom: 1px solid #e2e8f0; }
        .nav-link { color: var(--text-body); font-weight: 500; }
        .nav-link.active { color: var(--primary); background-color: var(--primary-light); border-radius: 8px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); }
        .doctor-card { transition: transform 0.3s; }
        .doctor-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(15, 23, 42, 0.1); }
        .doctor-avatar { width: 80px; height: 80px; background-color: var(--primary-light); color: var(--primary); font-size: 2rem; font-family: var(--font-display); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 15px; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color:var(--primary)" href="#">Portal Paciente</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/paciente/index}">Mi Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/paciente/citas}">Mis Citas</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/paciente/medicos}">Médicos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/paciente/historial}">Historial Médico</a></li>
                </ul>
                <div class="d-flex">
                    <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people text-primary me-2" style="color: var(--primary) !important;"></i>Staff Médico Disponible</h2>
            <a th:href="@{/paciente/citas}" class="btn" style="background-color: var(--primary); color: white;">Agendar Cita</a>
        </div>

        <div class="row">
            <!-- Iterate over medicos -->
            <div class="col-md-4 mb-4" th:each="medico : ${medicos}">
                <div class="card doctor-card p-4 text-center h-100">
                    <div class="mx-auto doctor-avatar" th:text="${medico.persona.nombres.substring(0,1)} + ${medico.persona.apellidos.substring(0,1)}">MD</div>
                    <h5 class="fw-bold mb-1" th:text="${medico.persona.nombres} + ' ' + ${medico.persona.apellidos}">Dr. Nombre</h5>
                    <p class="text-muted mb-3" th:text="${medico.especialidad.nombreEspecialidad}">Especialidad</p>
                    <p class="small mb-1"><strong>CMP:</strong> <span th:text="${medico.cmp}">00000</span></p>
                    <p class="small mb-0"><strong>Correo:</strong> <span th:text="${medico.persona.correo}">correo@ejemplo.com</span></p>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(medicos)}" class="col-12 text-center py-5">
                <p class="text-muted fs-5">No hay médicos registrados actualmente en el sistema.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
